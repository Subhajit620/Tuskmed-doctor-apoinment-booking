version: "3.8"
services:
  db:
    image: postgres:16-alpine
    container_name: tuskmed_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tuskmed
      POSTGRES_PASSWORD: tuskmed
      POSTGRES_DB: tuskmed
    ports:
      - "5433:5432"
    volumes:
      - tuskmed_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuskmed"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tuskmed_pgdata:
